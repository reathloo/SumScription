name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SumScription.slnx

      - name: Build
        run: dotnet build SumScription.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SumScription.slnx --configuration Release --no-build

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            runtime: osx-arm64
            platform: macos
          - label: macOS Intel
            os: macos-15
            runtime: osx-x64
            platform: macos
          - label: Windows x64
            os: windows-latest
            runtime: win-x64
            platform: windows
          - label: Windows ARM64
            os: windows-latest
            runtime: win-arm64
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/package-macos.sh "${{ matrix.runtime }}" "${{ steps.version.outputs.value }}" release-artifacts

      - name: Package Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Runtime "${{ matrix.runtime }}" -Version "${{ steps.version.outputs.value }}" -OutputDirectory release-artifacts

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.runtime }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-artifacts/*.zip
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "SumScription $GITHUB_REF_NAME"
