name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PayToCalc.slnx

      - name: Build
        run: dotnet build PayToCalc.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PayToCalc.slnx --configuration Release --no-build
